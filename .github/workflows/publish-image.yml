# Construye la imagen y la publica en GitHub Container Registry. Usa GITHUB_TOKEN: no toca Azure.
name: publish-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publicar imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar la licencia del driver ODBC
        env:
          ACCEPTED: ${{ vars.ACCEPT_MSODBC_EULA }}
        run: |
          if [ "$ACCEPTED" != "Y" ]; then
            echo "::error::Lee https://aka.ms/odbc18eula y, si la aceptas, define la variable ACCEPT_MSODBC_EULA=Y"
            exit 1
          fi
      - name: Calcular el nombre de la imagen
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/ledger" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          build-args: ACCEPT_MSODBC_EULA=Y
      - name: Mostrar el digest
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Imagen publicada"
            echo
            echo "Use este digest al ejecutar el workflow **deploy**:"
            echo
            echo '```'
            echo "$DIGEST"
            echo '```'
            echo
            echo "Imagen completa: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
