# Workflow reutilizable: despliega un ambiente. deploy.yml lo llama una vez por ambiente,
# de modo que dev y prod siguen exactamente los mismos pasos.
name: deploy-env

on:
  workflow_call:
    inputs:
      environment:
        description: Ambiente de GitHub y carpeta en infra/environments
        type: string
        required: true
      image:
        description: Imagen fijada por digest
        type: string
        required: true

jobs:
  deploy:
    name: Desplegar ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Este nombre define el "subject" del token OIDC y activa las reglas de protección del ambiente.
    environment: ${{ inputs.environment }}
    concurrency: terraform-${{ inputs.environment }}
    defaults:
      run:
        # Activa pipefail: sin esto, "estimate.py | tee" ocultaria el fallo del control de costos.
        shell: bash
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_database_location: ${{ vars.AZURE_DB_LOCATION }}
      TF_VAR_image: ${{ inputs.image }}
      ROOT: infra/environments/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Terraform init
        env:
          STATE_KEY: ledger-${{ inputs.environment }}.tfstate
          STATE_RG: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          STATE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
        run: |
          terraform -chdir="$ROOT" init -input=false \
            -backend-config="resource_group_name=$STATE_RG" \
            -backend-config="storage_account_name=$STATE_ACCOUNT" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=$STATE_KEY"
      - name: Terraform plan
        run: terraform -chdir="$ROOT" plan -input=false -out=deploy.tfplan
      - name: Control de costos
        env:
          BUDGET: ${{ vars.COST_BUDGET_USD }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          terraform -chdir="$ROOT" show -json deploy.tfplan > "$RUNNER_TEMP/plan.json"
          python3 cost/estimate.py --plan "$ENVIRONMENT=$RUNNER_TEMP/plan.json" --budget "$BUDGET" | tee "$RUNNER_TEMP/cost.txt"
          {
            echo "### Costo estimado de $ENVIRONMENT"
            echo '```'
            cat "$RUNNER_TEMP/cost.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Terraform apply
        run: terraform -chdir="$ROOT" apply -input=false deploy.tfplan
      - name: Prueba de humo
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          URL="$(terraform -chdir="$ROOT" output -raw app_url)"
          scripts/smoke.sh "$URL"
          echo "### $ENVIRONMENT desplegado en $URL" >> "$GITHUB_STEP_SUMMARY"
